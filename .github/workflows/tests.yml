name: Backend tests

on:
  pull_request:
    paths:
      - "app_base/**"
      - "alembic/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose*.yml"
  push:
    branches: [main, stage]
    paths:
      - "app_base/**"
      - "alembic/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose*.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check app_base alembic tests
      - name: Compile
        run: uv run python -m compileall -q app_base alembic tests
      - name: Unit tests
        run: uv run pytest -m unit -q
      - name: Integration tests
        run: uv run pytest -q
      - name: Docker build
        run: docker build --tag diddigo:${{ github.sha }} .
