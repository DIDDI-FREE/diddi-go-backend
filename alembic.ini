[alembic]
# Path to migration scripts. Uses a relative path from alembic.ini at the
# project root. The entry point in alembic/env.py picks up DATABASE_URL
# from settings automatically — this sqla.url is a placeholder that env.py
# overrides at runtime.
script_location = alembic
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5433/diddi_go

# Template for autogenerated migrations.
file_template = %%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s

# Timezone used when formatting the file_template timestamp.
# Defaults to UTC so the filename sorts cleanly regardless of dev machine locale.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
