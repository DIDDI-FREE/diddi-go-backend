services:
  docs:
    environment:
      # Secure-by-default for a production stack. Staging must set this to
      # true explicitly in Portainer.
      DOCS_PUBLIC_ENABLED: ${DOCS_PUBLIC_ENABLED:-false}
    networks:
      docs_proxy:
        aliases:
          - diddigo-docs

networks:
  # Attach Nginx Proxy Manager and this stack to the same existing network.
  # Portainer provides its actual name through PORTAINER_PROXY_NETWORK.
  docs_proxy:
    external: true
    name: ${PORTAINER_PROXY_NETWORK:?PORTAINER_PROXY_NETWORK is required}
