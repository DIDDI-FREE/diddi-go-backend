services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    environment:
      # Local development enables the site. The DiddiGo Portainer stack
      # overrides this with a secure-by-default false value.
      DOCS_PUBLIC_ENABLED: ${DOCS_PUBLIC_ENABLED:-true}
    expose:
      - "80"
    restart: unless-stopped
