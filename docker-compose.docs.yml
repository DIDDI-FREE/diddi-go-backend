services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    environment:
      # The local overlay enables the site. The Portainer overlay defaults to
      # false so production returns 404 unless it is explicitly enabled.
      DOCS_PUBLIC_ENABLED: ${DOCS_PUBLIC_ENABLED:-true}
    expose:
      - "80"
    restart: unless-stopped
