services:
  init-db:
    extends:
      file: docker-compose.yml
      service: app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-diddi_go}
      REDIS_URL: redis://redis:6379/0
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-diddi_go}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    command: uvicorn app_base.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app_base:/app/app_base
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./tests:/app/tests
    depends_on:
      init-db:
        condition: service_completed_successfully

  db:
    ports:
      - "${POSTGRES_PORT:-15433}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-16380}:6379"
