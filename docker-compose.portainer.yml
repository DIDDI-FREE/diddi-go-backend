services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-DiddiGo}
      APP_ENV: ${APP_ENV:-production}
      API_PREFIX: ${API_PREFIX:-/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-^https?://(localhost|127\.0\.0\.1)(:\d+)?$}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-diddi_go}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_LIFETIME_MINUTES: ${JWT_ACCESS_LIFETIME_MINUTES:-15}
      JWT_REFRESH_LIFETIME_DAYS: ${JWT_REFRESH_LIFETIME_DAYS:-30}
      OTP_RATE_LIMIT_SECONDS: ${OTP_RATE_LIMIT_SECONDS:-60}
      OTP_CODE_LIFETIME_SECONDS: ${OTP_CODE_LIFETIME_SECONDS:-300}
      DIDDIMAP_BASE_URL: ${DIDDIMAP_BASE_URL:-http://abidjanmaps-backend-staging.diddifree.com}
      DIDDIMAP_ACCESS_TOKEN: ${DIDDIMAP_ACCESS_TOKEN:-}
      DIDDIMAP_SERVICE_CLIENT_ID: ${DIDDIMAP_SERVICE_CLIENT_ID:-}
      DIDDIMAP_SERVICE_TOKEN: ${DIDDIMAP_SERVICE_TOKEN:-}
      IDENTITY_BASE_URL: ${IDENTITY_BASE_URL:-https://auth-staging.diddifree.com}
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-}
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-diddifree-id}
      IDENTITY_PROFILE_URL: ${IDENTITY_PROFILE_URL:-}
      IDENTITY_SERVICE_KEY: ${IDENTITY_SERVICE_KEY:-}
      IDENTITY_SERVICE_CLIENT_ID: ${IDENTITY_SERVICE_CLIENT_ID:-}
      IDENTITY_SERVICE_CLIENT_SECRET: ${IDENTITY_SERVICE_CLIENT_SECRET:-}
      IDENTITY_SERVICE_TIMEOUT_SECONDS: ${IDENTITY_SERVICE_TIMEOUT_SECONDS:-5}
      KYC_COMMAND_IDEMPOTENCY_TTL_SECONDS: ${KYC_COMMAND_IDEMPOTENCY_TTL_SECONDS:-86400}
      DRIVER_PROVISIONING_IDEMPOTENCY_TTL_SECONDS: ${DRIVER_PROVISIONING_IDEMPOTENCY_TTL_SECONDS:-86400}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      DIDDIPAY_BASE_URL: ${DIDDIPAY_BASE_URL:-}
      DIDDIPAY_CLIENT_ID: ${DIDDIPAY_CLIENT_ID:-diddigo}
      DIDDIPAY_SERVICE_KEY: ${DIDDIPAY_SERVICE_KEY:-}
      DIDDIPAY_CALLBACK_SECRET: ${DIDDIPAY_CALLBACK_SECRET:-}
      DIDDIPAY_HTTP_TIMEOUT_SECONDS: ${DIDDIPAY_HTTP_TIMEOUT_SECONDS:-15}
      DIDDIGO_PAYMENT_CALLBACK_URL: ${DIDDIGO_PAYMENT_CALLBACK_URL:-}
      DIDDIGO_CONSUMER_RETURN_URL: ${DIDDIGO_CONSUMER_RETURN_URL:-}
      DIDDIGO_PRO_RETURN_URL: ${DIDDIGO_PRO_RETURN_URL:-}
      PAYMENT_RETURN_CONTEXT_TTL_SECONDS: ${PAYMENT_RETURN_CONTEXT_TTL_SECONDS:-900}
      DRIVER_MIN_BALANCE: ${DRIVER_MIN_BALANCE:-0}
      DRIVER_MAX_ESTIMATED_COMMISSION: ${DRIVER_MAX_ESTIMATED_COMMISSION:-0}
      WAITING_PRICE_PER_MINUTE_XOF: ${WAITING_PRICE_PER_MINUTE_XOF:-100}
      WAITING_STATIONARY_SPEED_THRESHOLD_KMH: ${WAITING_STATIONARY_SPEED_THRESHOLD_KMH:-3}
      WAITING_TELEMETRY_TTL_SECONDS: ${WAITING_TELEMETRY_TTL_SECONDS:-30}
      PAYMENT_RECONCILIATION_ENABLED: ${PAYMENT_RECONCILIATION_ENABLED:-true}
      PAYMENT_RECONCILIATION_INTERVAL_SECONDS: ${PAYMENT_RECONCILIATION_INTERVAL_SECONDS:-300}
      PAYMENT_RECONCILIATION_BATCH_SIZE: ${PAYMENT_RECONCILIATION_BATCH_SIZE:-50}
      PAYMENT_RECONCILIATION_MIN_AGE_SECONDS: ${PAYMENT_RECONCILIATION_MIN_AGE_SECONDS:-120}
      PAYMENT_RECONCILIATION_MAX_AGE_SECONDS: ${PAYMENT_RECONCILIATION_MAX_AGE_SECONDS:-259200}
      EMERGENCY_SUPPORT_EMAIL: ${EMERGENCY_SUPPORT_EMAIL:-direction.generale@diddifree.com}
      EMERGENCY_SUPPORT_WHATSAPP: ${EMERGENCY_SUPPORT_WHATSAPP:-}
      EMERGENCY_WHATSAPP_WEBHOOK_URL: ${EMERGENCY_WHATSAPP_WEBHOOK_URL:-}
      EMERGENCY_WHATSAPP_API_KEY: ${EMERGENCY_WHATSAPP_API_KEY:-}
      EMERGENCY_EMAIL_FROM: ${EMERGENCY_EMAIL_FROM:-alerts@diddifree.com}
      EMERGENCY_SMTP_HOST: ${EMERGENCY_SMTP_HOST:-}
      EMERGENCY_SMTP_PORT: ${EMERGENCY_SMTP_PORT:-587}
      EMERGENCY_SMTP_USERNAME: ${EMERGENCY_SMTP_USERNAME:-}
      EMERGENCY_SMTP_PASSWORD: ${EMERGENCY_SMTP_PASSWORD:-}
      EMERGENCY_SMTP_USE_TLS: ${EMERGENCY_SMTP_USE_TLS:-true}
      BACKEND_PORT: ${BACKEND_PORT:-18000}
      POSTGRES_PORT: ${POSTGRES_PORT:-15432}
      REDIS_PORT: ${REDIS_PORT:-16379}
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    command: sh /app/docker/start.sh

  db:
    build:
      context: .
      dockerfile: Dockerfile.postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diddi_go}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # Redis stays internal to the stack in Portainer to avoid host port clashes.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
