services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-DiddiGo}
      APP_ENV: ${APP_ENV:-development}
      API_PREFIX: ${API_PREFIX:-/v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/diddi_go}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-at-least-32-characters-long}
      JWT_ACCESS_LIFETIME_MINUTES: ${JWT_ACCESS_LIFETIME_MINUTES:-15}
      JWT_REFRESH_LIFETIME_DAYS: ${JWT_REFRESH_LIFETIME_DAYS:-30}
      OTP_RATE_LIMIT_SECONDS: ${OTP_RATE_LIMIT_SECONDS:-60}
      OTP_CODE_LIFETIME_SECONDS: ${OTP_CODE_LIFETIME_SECONDS:-300}
      DIDDIMAP_BASE_URL: ${DIDDIMAP_BASE_URL:-http://diddimap:4000}
      IDENTITY_BASE_URL: ${IDENTITY_BASE_URL:-}
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-}
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-diddifree-id}
      IDENTITY_PROFILE_URL: ${IDENTITY_PROFILE_URL:-}
      IDENTITY_SERVICE_KEY: ${IDENTITY_SERVICE_KEY:-}
      BACKEND_PORT: ${BACKEND_PORT:-18000}
      POSTGRES_PORT: ${POSTGRES_PORT:-15432}
      REDIS_PORT: ${REDIS_PORT:-16379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diddi_go}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diddi_go"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
