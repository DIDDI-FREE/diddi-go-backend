server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Production remains intentionally undiscoverable until publication is
    # explicitly approved through DOCS_PUBLIC_ENABLED=true.
    location / {
        return 404;
    }
}
