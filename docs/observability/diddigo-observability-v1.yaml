manifest_version: "1.1.3"
protocol: DIDDI-Observability-v1.1.3
service:
  namespace: diddi
  name: diddigo
  version_source: SERVICE_VERSION or GIT_SHA
  environment: ENVIRONMENT
  instance_id: SERVICE_INSTANCE_ID or process-generated
  deployment_id: DEPLOYMENT_ID
  component: api
  owner: DiddiGo team
  repository: diddigo
components:
  api:
    internal_port: 8000
    health: /health
    readiness: /ready
    metrics: /metrics
    metrics_auth: Bearer METRICS_BEARER_TOKEN
    signals: [otlp_logs, http_metrics, otlp_traces]
  workers:
    names: [payment-reconciliation, capability-projection]
    heartbeat_metric: diddi_worker_heartbeat_timestamp_seconds
dependencies:
  critical: [postgresql, redis]
  optional: [diddimap, diddifiles, identity, diddipay]
  observability: DiddiObserve
collector:
  traces_endpoint: OTEL_EXPORTER_OTLP_ENDPOINT
  logs_endpoint: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
  headers_secret_ref: OTEL_EXPORTER_OTLP_HEADERS
  protocol: OTLP/HTTP
  timeout_seconds: OTEL_EXPORT_TIMEOUT_SECONDS
  queue_limit: OTEL_MAX_QUEUE_SIZE
configuration:
  required_from_central_platform:
    - OTEL_EXPORTER_OTLP_ENDPOINT
    - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
    - OTEL_LOGS_ENABLED
    - OTEL_EXPORTER_OTLP_HEADERS (secret reference/value)
    - METRICS_BEARER_TOKEN (unique rotatable scrape secret)
    - SERVICE_VERSION and DEPLOYMENT_ID
  defaults:
    OTEL_TRACES_SAMPLER_ARG: 0.1
    OTEL_SCHEDULE_DELAY_MS: 5000
    OTEL_MAX_QUEUE_SIZE: 2048
security:
  logs: OTLP HTTP/protobuf; stdout remains local diagnostic output; secrets, tokens, credentials, phone, email, IP and raw bodies suppressed
  otp_exception:
    enabled_by: OTP_PLAINTEXT_LOGGING_ENABLED
    scope: OTP_PLAINTEXT_LOGGING_SCOPE
    required_central_value: false
    central_policy: Set OTP_PLAINTEXT_LOGGING_ENABLED=false before central collection. If temporarily enabled, exclude OTP plaintext events from Loki/file ingestion.
  metrics: private authenticated endpoint; closed when token is absent
  trace_headers: W3C traceparent/tracestate
validation:
  locally_evidenced: [C01, C02, C03, C05, C08, C09]
  partially_local: [C04, C06, C10]
  not_applicable:
    C07: DiddiGo has polling workers, not an async message consumer; worker spans and W3C HTTP propagation are implemented.
  central_required: [C07, C11, C12]
  status: implementation_ready_not_end_to_end_certified
  note: Publication does not certify collector ingestion, storage, dashboards, retention or alerts.
