site_name: DiddiGo Documentation
site_description: Contrats API, parcours métier et intégrations du module DiddiGo
site_author: DiddiFree
site_url: https://docs-go-staging.diddifree.com/

docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: fr
  logo: assets/diddigo-mark.svg
  favicon: assets/diddigo-mark.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Accueil: README.md
  - Produit:
      - MVP figé: product/DIDDIGO-MVP-FIGE.md
  - API:
      - Vue d'ensemble: api/index.md
      - Contrat HTTP et WebSocket: api/API_CONTRACT.md
      - Catalogue d'erreurs: api/error-catalog.md
      - Questions ouvertes: api/open-questions.md
      - Compatibilité WebSocket: realtime/WEBSOCKET_CONTRACT.md
  - Architecture:
      - Exécution: architecture/RUNTIME_ARCHITECTURE.md
  - Parcours métier:
      - Passager: guides/passenger-ride-flow.md
      - Chauffeur: guides/driver-ride-flow.md
      - KYC et KYV: guides/driver-kyc-kyv.md
      - Paiements et wallet: guides/payments-wallet.md
      - Dette passager: guides/passenger-debts.md
      - SOS et sécurité: guides/sos-safety.md
      - Scoring: guides/scoring.md
  - Frontend:
      - Acces aux contrats: frontend/DIDDIGO_FRONTEND_CONTRACT_ACCESS_BRIEF_2026-10-19.md
      - Brief integre (20 octobre): frontend/DIDDIGO_FRONTEND_BRIEF_2026-10-20.md
      - KYC et KYV: frontend/DIDDIGO_FRONTEND_KYC_KYV_BRIEF_2026-10-19.md
      - Brief du 12 octobre: frontend/DIDDIGO_FRONTEND_BRIEF_2026-10-12.md
      - Clarifications V2: frontend/DIDDIGO_FRONTEND_CLARIFICATIONS_2026-10-12_V2.md
      - Retraits chauffeur: frontend/DIDDIGO_DRIVER_WITHDRAWALS_BRIEF_2026-10-10.md
      - Dette passager (20 octobre): frontend/DIDDIGO_FRONTEND_PASSENGER_DEBT_BRIEF_2026-10-20.md
      - Brief integre (22 octobre): frontend/DIDDIGO_FRONTEND_BRIEF_2026-10-22.md
  - Intégrations:
      - DiddiFiles: integrations/diddifiles.md
      - DiddiPay: integrations/diddipay.md
      - DiddiMap: integrations/diddimap.md
      - DiddiAdmin: integrations/diddiadmin-kyc-review.md
      - DiddiSupport: integrations/diddisupport.md
      - DiddiFree Pro - Scores: integrations/diddifree-score.md
      - SMS: integrations/sms.md
  - Tests:
      - Checklist du 19 octobre: testing/DIDDIGO_TEST_CHECKLIST_2026-10-19.md
      - DiddiSupport (20 octobre): testing/DIDDIGO_DIDDISUPPORT_TEST_CHECKLIST_2026-10-20.md
      - DiddiComms: integrations/diddicomms.md
  - Références:
      - Statuts: reference/statuses.md
      - Permissions: reference/permissions.md
      - Configuration technique: configuration/CONFIGURATION_REFERENCE.md
      - Valeurs métier: reference/configuration.md
      - Cas différés: reference/deferred-edge-cases.md
  - Changelog:
      - 14 octobre 2026: changelog/2026-10-14.md
      - 15 octobre 2026: changelog/2026-10-15.md
      - 12 octobre 2026: changelog/2026-10-12.md
      - 20 octobre 2026: changelog/2026-10-20.md
      - 20 octobre 2026 - DiddiSupport: changelog/2026-10-20-support-context.md
      - 20 octobre 2026 - Scoring: changelog/2026-10-20-scoring-fairness.md
      - 22 octobre 2026: changelog/2026-10-22.md

exclude_docs: |
  archive/
  frontend/DIDDIGO_FRONTEND_BRIEF_2026-10-10 - Copie.md
  jira/

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: fr

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DIDDI-FREE/diddi-go-backend

copyright: Documentation interne DiddiFree - DiddiGo
