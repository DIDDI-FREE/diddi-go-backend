[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diddi-go"
version = "0.1.0"
description = "DiddiGo modular FastAPI VTC backend (monolithe modulaire, conçu pour extraction)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "redis[hiredis]>=5.0",
    "alembic>=1.13",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "app_base"}

[tool.setuptools.packages.find]
where = ["app_base"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # `Depends(...)` / `Query(...)` in defaults is the documented FastAPI
    # idiom, not the mutable-default bug this rule targets.
    "B008",
    # `str, Enum` is deliberate: it keeps `.value` implicit when these enums
    # are serialised into JSON responses and SQL parameters.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated; leave their import style alone.
"alembic/versions/*" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
